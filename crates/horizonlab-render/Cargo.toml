[package]
name = "horizonlab-render"
description = "CPU reference renderer for HorizonLab"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "horizonlab"

[[bin]]
name = "horizonlab"
path = "src/main.rs"

[[bin]]
name = "horizonlab-infall"
path = "src/bin/infall.rs"

[dependencies]
horizonlab-core = { path = "../horizonlab-core" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1.10"
